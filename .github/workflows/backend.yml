name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'

jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kinspace
          POSTGRES_PASSWORD: spacekin
          POSTGRES_DB: kinspace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kinspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || { echo "The following files are not gofmt formatted:"; gofmt -l .; exit 1; }

      - name: Tidy check
        run: |
          go mod tidy
          test -z "$(git diff -- go.mod go.sum)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://kinspace:spacekin@localhost:5433/kinspace?sslmode=disable
        run: go test -race -count=1 -tags integration ./internal/storage/postgres/
